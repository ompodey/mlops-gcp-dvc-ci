name: IRIS CD Pipeline

on:
  push:
    branches:
      - main
      - dev
      - week6_kubernetes
      - week7_stress
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'   # required for GCP auth OIDC (optional enhancements)

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout Repo
        uses: actions/checkout@v3

      # 2️⃣ Setup Google Cloud authentication
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 3️⃣ Setup gcloud SDK
      - name: Setup gcloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          export_default_credentials: true

      # 4️⃣ Configure Docker authentication for Artifact Registry
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      # 5️⃣ Build & Push Docker image to Artifact Registry
      - name: Build and Push Docker Image
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION }}
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/iris-api-repo/iris-api:latest"
          echo "Building Docker image: $IMAGE"
          docker build -t $IMAGE .
          docker push $IMAGE

      # 6️⃣ Get GKE cluster credentials
      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v1
        with:
          cluster_name: iris-cluster
          location: us-central1-a
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # 7️⃣ Deploy to GKE
      - name: Deploy to Kubernetes (GKE)
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          # Replace placeholder in manifest with actual project id
          sed -i "s|\${PROJECT_ID}|$PROJECT_ID|g" k8s_deployment.yaml

          echo "Applying Kubernetes deployment..."
          kubectl apply -f k8s_deployment.yaml

          echo "Waiting for rollout (90s timeout)..."
          kubectl rollout status deployment/iris-api-deployment --timeout=90s

      # 8️⃣ Verify Deployed Service
      - name: Verify Deployed Service
        run: |
          echo "Checking running pods and service status..."
          kubectl get pods -o wide
          kubectl get svc iris-api-service -o wide

      # 9️⃣ Wait for LoadBalancer External IP
      - name: Wait for LoadBalancer External IP
        run: |
          echo "Waiting for external IP..."
          for i in {1..30}; do
            IP=$(kubectl get svc iris-api-service -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            if [ -n "$IP" ]; then
              echo "EXTERNAL_IP=$IP" >> $GITHUB_ENV
              echo "External IP: $IP"
              break
            fi
            echo "External IP not ready yet, retrying..."
            sleep 10
          done

      # 10️⃣ Install wrk
      - name: Install wrk
        run: sudo apt-get update && sudo apt-get install -y wrk

      # 11️⃣ Create POST script for wrk
      - name: Create POST script
        run: |
          cat > post.lua <<'EOF'
          wrk.method = "POST"
          wrk.body   = '{"sepal_length":5.1,"sepal_width":3.5,"petal_length":1.4,"petal_width":0.2}'
          wrk.headers["Content-Type"] = "application/json"
          EOF

      # 12️⃣ Run stress test (>1000 requests)
      - name: Run stress test (>1000 requests)
        env:
          EXTERNAL_IP: ${{ env.EXTERNAL_IP }}
        run: |
          echo "Running wrk against http://$EXTERNAL_IP/predict"
          wrk -t4 -c1000 -d20s -s post.lua http://$EXTERNAL_IP/predict | tee wrk_output.txt
